name: Starter checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-starter:
    # The setup-python distribution publishes CPython 3.9 for Ubuntu 24.04.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m cct check
      - run: python -m unittest discover -s tests -v
      - run: python -m cct demo
  telemetry-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Collector routes and Prometheus with pinned images
        run: sh observability/validate_images.sh
